<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>贪吃蛇 Snake</title>
<style>
  :root{
    --bg:#0B0E12; --panel:#12171E; --line:#20272F;
    --green:#3DDC84; --coral:#FF6B4A; --text:#E8EDF2; --dim:#7A8696;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    min-height:100vh; background:radial-gradient(1100px 600px at 50% -10%, #16202B 0%, var(--bg) 60%);
    color:var(--text);
    font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
    display:flex; align-items:center; justify-content:center; padding:24px 16px;
  }
  .panel{width:100%; max-width:660px; background:var(--panel); border:1px solid var(--line);
    border-radius:20px; padding:22px; box-shadow:0 30px 70px rgba(0,0,0,.55);}
  header{display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:16px; flex-wrap:wrap;}
  h1{font-size:24px; letter-spacing:2px; font-weight:700; color:var(--green);
    text-shadow:0 0 22px rgba(61,220,130,.35);}
  .stats{display:flex; gap:22px;}
  .stat span{display:block; font-size:11px; letter-spacing:1.5px; color:var(--dim);}
  .stat b{font-size:22px; font-variant-numeric:tabular-nums;}
  .stat.best b{color:var(--coral);}
  #err{display:none; margin:0 0 14px; padding:12px 14px; border:1px solid #7A2B2B;
    background:#2A1416; color:#FF9C8E; border-radius:10px; font-size:13px; line-height:1.7;}
  canvas{width:100%; aspect-ratio:624/520; display:block; border:1px solid var(--line);
    border-radius:14px; background:#0F1217; touch-action:none; cursor:pointer;}
  .actions{display:flex; gap:10px; margin-top:14px;}
  .actions button{flex:1; height:44px; border:1px solid var(--line); background:#1B222B;
    color:var(--text); font-size:13px; letter-spacing:1px; border-radius:11px; cursor:pointer;}
  .actions button:hover{border-color:var(--green); color:var(--green);}

  /* ---- 速度面板 ---- */
  .tune{margin-top:14px; border:1px solid var(--line); border-radius:14px;
    padding:14px; background:#10151B;}
  .tune .row{display:flex; align-items:center; gap:10px; margin-bottom:12px;}
  .tune .row:last-child{margin-bottom:0;}
  .lbl{font-size:11px; letter-spacing:1.5px; color:var(--dim); width:32px; flex:none;}
  .mode{display:flex; gap:8px;}
  .mode button,.chips button{border:1px solid var(--line); background:#1B222B;
    color:var(--dim); border-radius:999px; padding:7px 16px; font-size:13px;
    letter-spacing:1px; cursor:pointer;}
  .mode button.on{border-color:var(--green); color:var(--green); background:rgba(61,220,132,.1);}
  .mode button:hover,.chips button:hover{color:var(--text);}
  .chips button.on{border-color:var(--coral); color:var(--coral);}
  .hint{font-size:12px; color:var(--dim); margin-left:auto;}
  .step{width:34px; height:34px; flex:none; border:1px solid var(--line); background:#1B222B;
    color:var(--text); font-size:19px; line-height:1; border-radius:10px; cursor:pointer;}
  .step:hover{border-color:var(--green); color:var(--green);}
  .spd-val{font-size:21px; color:var(--coral); font-variant-numeric:tabular-nums;
    min-width:56px; text-align:right; letter-spacing:.5px;}
  .chips{display:flex; gap:8px; flex-wrap:wrap;}
  input[type=range]{-webkit-appearance:none; appearance:none; flex:1; min-width:80px;
    height:6px; border-radius:6px; background:#252D37; outline:none;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; appearance:none;
    width:20px; height:20px; border-radius:50%; background:var(--green);
    border:3px solid #0F1217; box-shadow:0 0 14px rgba(61,220,130,.5); cursor:pointer;}
  input[type=range]::-moz-range-thumb{width:20px; height:20px; border-radius:50%;
    background:var(--green); border:3px solid #0F1217; cursor:pointer;}

  .pad{display:none; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:14px;}
  .pad button{height:58px; border:1px solid var(--line); background:#1B222B;
    color:var(--text); font-size:22px; border-radius:12px; cursor:pointer;}
  .pad button:active{background:var(--green); color:#0B0E12;}
  .pad .up{grid-column:2;} .pad .left{grid-column:1;} .pad .down{grid-column:2;} .pad .right{grid-column:3;}
  @media (hover:none){ .pad{display:grid;} }
  footer{margin-top:14px; font-size:12px; color:var(--dim); text-align:center; letter-spacing:.5px;}
</style>
</head>
<body>
<main class="panel">
  <header>
    <h1>贪 吃 蛇</h1>
    <div class="stats">
      <div class="stat"><span>得分</span><b id="score">0</b></div>
      <div class="stat best"><span>最高分</span><b id="best">0</b></div>
      <div class="stat"><span>速度</span><b id="speed">6.5</b></div>
    </div>
  </header>

  <div id="err"></div>
  <canvas id="board"></canvas>

  <div class="actions">
    <button id="btnPause">暂停</button>
    <button id="btnRestart">重新开始</button>
    <button id="btnSound">声音：开</button>
  </div>

  <section class="tune">
    <div class="row">
      <span class="lbl">模式</span>
      <div class="mode">
        <button class="on" data-mode="level">闯关</button>
        <button data-mode="free">自由</button>
      </div>
      <span class="hint" id="modeHint">吃一个 +0.3，越玩越快</span>
    </div>
    <div class="row">
      <span class="lbl">速度</span>
      <button class="step" id="spdDown">−</button>
      <input type="range" id="spdRange" min="1" max="20" step="0.5" value="6.5">
      <button class="step" id="spdUp">+</button>
      <b class="spd-val" id="spdVal">6.5</b>
    </div>
    <div class="chips">
      <button data-spd="3">慢速</button>
      <button data-spd="6.5">标准</button>
      <button data-spd="12">高速</button>
      <button data-spd="18">极速</button>
      <button data-spd="20">极限</button>
    </div>
  </section>

  <div class="pad">
    <button class="up" data-dir="0,-1">▲</button>
    <button class="left" data-dir="-1,0">◀</button>
    <button class="down" data-dir="0,1">▼</button>
    <button class="right" data-dir="1,0">▶</button>
  </div>

  <footer>方向键 / WASD 移动 · 空格暂停 · R 重开 · M 静音 · - / = 调速 · 手机可直接点按钮</footer>
</main>

<script>
/* ============ 常量 ============ */
const COLS = 24, ROWS = 20, CELL = 26;
const W = COLS * CELL, H = ROWS * CELL;
const START_SPEED = 6.5, SPEED_STEP = 0.3;
const SPEED_MIN = 1, SPEED_MAX = 20;
const C = {
  bg:'#0F1217', grid:'#1A1F27', head:'#78F5B4',
  food:'#FF6B4A', foodHi:'#FFBEB0', text:'#E8EDF2', dim:'#7A8696'
};
const FONT = '"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif';

/* ============ 画布 ============ */
const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');
const dpr = Math.min(window.devicePixelRatio || 1, 2);
canvas.width = W * dpr; canvas.height = H * dpr;
ctx.scale(dpr, dpr);

/* ============ 存档 ============ */
function loadBest(){
  try{ return parseInt(localStorage.getItem('snake_best') || '0', 10) || 0; }
  catch(e){ return 0; }
}
function saveBest(v){
  try{ localStorage.setItem('snake_best', String(v)); }catch(e){}
}

/* ============ 状态 ============ */
let body, dir, queue, food, score, speed, moveTimer, lastTime, state, muted = false;
let mode = 'level';
let baseSpeed = START_SPEED;

function reset(){
  const cx = COLS >> 1, cy = ROWS >> 1;
  body = [[cx, cy], [cx - 1, cy], [cx - 2, cy]];
  dir = [1, 0];
  queue = [];
  score = 0;
  speed = baseSpeed;
  moveTimer = 0;
  state = 'ready';
  spawnFood();
  syncHUD(); syncTuneUI();
  document.getElementById('btnPause').textContent = '暂停';
}

function spawnFood(){
  const free = [];
  const occupied = new Set(body.map(p => p[0] + ',' + p[1]));
  for (let x = 0; x < COLS; x++)
    for (let y = 0; y < ROWS; y++)
      if (!occupied.has(x + ',' + y)) free.push([x, y]);
  food = free.length ? free[(Math.random() * free.length) | 0] : null;
  if (!food) gameOver();
}

function syncHUD(){
  document.getElementById('score').textContent = score;
  document.getElementById('best').textContent = loadBest();
  document.getElementById('speed').textContent = speed.toFixed(1);
}

/* ============ 速度与模式 ============ */
function setSpeed(v){
  v = Math.min(SPEED_MAX, Math.max(SPEED_MIN, Math.round(v * 2) / 2));
  baseSpeed = v;
  speed = v;
  syncHUD(); syncTuneUI();
}

function setMode(m){
  mode = m;
  if (m === 'free') speed = baseSpeed;
  syncHUD(); syncTuneUI();
}

function syncTuneUI(){
  const range = document.getElementById('spdRange');
  if (range) range.value = baseSpeed;
  document.getElementById('spdVal').textContent = baseSpeed.toFixed(1);
  document.querySelectorAll('.mode button').forEach(b =>
    b.classList.toggle('on', b.dataset.mode === mode));
  document.getElementById('modeHint').textContent =
    mode === 'level' ? '吃一个 +0.3，越玩越快' : '速度固定，适合练手感';
  document.querySelectorAll('.chips button').forEach(b =>
    b.classList.toggle('on', Number(b.dataset.spd) === baseSpeed));
}

document.querySelectorAll('.mode button').forEach(b =>
  b.addEventListener('click', () => { initAudio(); setMode(b.dataset.mode); }));

document.querySelectorAll('.chips button').forEach(b =>
  b.addEventListener('click', () => { initAudio(); setSpeed(Number(b.dataset.spd)); }));

document.getElementById('spdRange').addEventListener('input', e =>
  setSpeed(parseFloat(e.target.value)));
document.getElementById('spdDown').addEventListener('click', () => { initAudio(); setSpeed(baseSpeed - 0.5); });
document.getElementById('spdUp').addEventListener('click', () => { initAudio(); setSpeed(baseSpeed + 0.5); });

/* ============ 音频初始化（修复浏览器自动播放限制） ============ */
let audio = null;
function initAudio() {
  if (!audio) {
    audio = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audio.state === 'suspended') {
    audio.resume();
  }
}

function beep(freq, dur, type = 'square', vol = 0.05){
  if (muted) return;
  try{
    initAudio();
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, audio.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + dur);
    o.connect(g).connect(audio.destination);
    o.start(); o.stop(audio.currentTime + dur);
  }catch(e){}
}

/* ============ 输入 ============ */
function queueDir(nd){
  if (state === 'over') { reset(); return; }
  if (state === 'ready') state = 'playing';
  if (state === 'paused') return;
  const last = queue.length ? queue[queue.length - 1] : dir;
  if (nd[0] === last[0] && nd[1] === last[1]) return;
  if (nd[0] + last[0] === 0 && nd[1] + last[1] === 0) return;
  if (queue.length >= 2) return;
  queue.push(nd);
}

const KEYS = {
  ArrowUp:[0,-1], ArrowDown:[0,1], ArrowLeft:[-1,0], ArrowRight:[1,0],
  w:[0,-1], s:[0,1], a:[-1,0], d:[1,0]
};
window.addEventListener('keydown', e => {
  initAudio();
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (KEYS[k] || k === ' ' || k === 'Spacebar' || k === '-' || k === '=' || k === '+') e.preventDefault();
  if (KEYS[k]) return queueDir(KEYS[k]);
  if (k === ' ' || k === 'Spacebar') return togglePause();
  if (k === 'r') return reset();
  if (k === 'm') return toggleSound();
  if (k === '-') return setSpeed(baseSpeed - 0.5);
  if (k === '=' || k === '+') return setSpeed(baseSpeed + 0.5);
});

function togglePause(){
  if (state === 'over'){ reset(); return; }
  if (state === 'ready'){ state = 'playing'; return; }
  state = state === 'paused' ? 'playing' : 'paused';
  document.getElementById('btnPause').textContent = state === 'paused' ? '继续' : '暂停';
}
function toggleSound(){
  muted = !muted;
  document.getElementById('btnSound').textContent = '声音：' + (muted ? '关' : '开');
  if (!muted) beep(660, 0.06);
}

document.getElementById('btnPause').addEventListener('click', () => { initAudio(); togglePause(); });
document.getElementById('btnRestart').addEventListener('click', () => { initAudio(); reset(); });
document.getElementById('btnSound').addEventListener('click', () => { initAudio(); toggleSound(); });

document.querySelectorAll('.pad button').forEach(b => {
  b.addEventListener('click', () => {
    initAudio();
    const [x, y] = b.dataset.dir.split(',').map(Number);
    queueDir([x, y]);
  });
});

canvas.addEventListener('click', () => {
  initAudio();
  if (state === 'ready' || state === 'paused'){ state = 'playing'; }
  else if (state === 'over'){ reset(); }
  document.getElementById('btnPause').textContent = '暂停';
});

/* 触屏滑动 */
let touchStart = null;
canvas.addEventListener('touchstart', e => {
  initAudio();
  const t = e.touches[0]; touchStart = [t.clientX, t.clientY];
}, {passive:true});
canvas.addEventListener('touchend', e => {
  if (!touchStart) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - touchStart[0], dy = t.clientY - touchStart[1];
  if (Math.abs(dx) > 18 || Math.abs(dy) > 18)
    queueDir(Math.abs(dx) > Math.abs(dy) ? [Math.sign(dx), 0] : [0, Math.sign(dy)]);
  touchStart = null;
});

/* ============ 逻辑 ============ */
function step(){
  if (queue.length) dir = queue.shift();
  const [hx, hy] = body[0];
  const head = [hx + dir[0], hy + dir[1]];

  if (head[0] < 0 || head[0] >= COLS || head[1] < 0 || head[1] >= ROWS) return gameOver();

  const grow = !!food && head[0] === food[0] && head[1] === food[1];
  const limit = grow ? body.length : body.length - 1;
  for (let i = 0; i < limit; i++)
    if (body[i][0] === head[0] && body[i][1] === head[1]) return gameOver();

  body.unshift(head);
  if (grow){
    score += 1;
    if (mode === 'level') speed = Math.min(SPEED_MAX, speed + SPEED_STEP);
    beep(660, 0.08, 'triangle');
    spawnFood();
    syncHUD();
  } else {
    body.pop();
  }
}

function gameOver(){
  state = 'over';
  if (score > loadBest()){ saveBest(score); syncHUD(); }
  beep(220, 0.18, 'sawtooth', 0.06);
  setTimeout(() => beep(150, 0.32, 'sawtooth', 0.06), 130);
}

function update(dt){
  if (state !== 'playing') return;
  moveTimer += dt;
  const interval = 1000 / speed;
  let guard = 0;
  while (moveTimer >= interval && guard++ < 10){
    moveTimer -= interval;
    if (state === 'playing') step();
  }
}

/* ============ 绘制 ============ */
function roundRect(x, y, w, h, r){
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, h, r);
  else ctx.rect(x, y, w, h);
}

function draw(time){
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);

  ctx.strokeStyle = C.grid; ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = 0; x <= COLS; x++){ ctx.moveTo(x * CELL + .5, 0); ctx.lineTo(x * CELL + .5, H); }
  for (let y = 0; y <= ROWS; y++){ ctx.moveTo(0, y * CELL + .5); ctx.lineTo(W, y * CELL + .5); }
  ctx.stroke();

  if (food){
    const cx = food[0] * CELL + CELL / 2, cy = food[1] * CELL + CELL / 2;
    const pulse = 0.5 + 0.5 * Math.sin(time / 220);
    const r = CELL * 0.85 + pulse * 4;
    const g = ctx.createRadialGradient(cx, cy, 2, cx, cy, r);
    g.addColorStop(0, 'rgba(255,107,74,.38)');
    g.addColorStop(1, 'rgba(255,107,74,0)');
    ctx.fillStyle = g;
    ctx.fillRect(cx - r, cy - r, r * 2, r * 2);
    ctx.fillStyle = C.food;
    ctx.beginPath(); ctx.arc(cx, cy, CELL / 2 - 3, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = C.foodHi;
    ctx.beginPath(); ctx.arc(cx - 4, cy - 4, 3, 0, Math.PI * 2); ctx.fill();
  }

  const n = body.length;
  for (let i = n - 1; i >= 0; i--){
    const t = i / Math.max(1, n - 1);
    const pad = 2 + Math.floor(t * 2.5);
    const size = CELL - pad * 2;
    const x = body[i][0] * CELL + pad, y = body[i][1] * CELL + pad;
    if (i === 0) ctx.fillStyle = C.head;
    else{
      const m = Math.min(1, t * 1.15);
      const r = Math.round(61 + (28 - 61) * m);
      const gg = Math.round(220 + (120 - 220) * m);
      const b = Math.round(132 + (82 - 132) * m);
      ctx.fillStyle = 'rgb(' + r + ',' + gg + ',' + b + ')';
    }
    roundRect(x, y, size, size, Math.max(4, size / 2)); ctx.fill();
  }

  const [hx, hy] = body[0];
  const cx = hx * CELL + CELL / 2, cy = hy * CELL + CELL / 2;
  const fwd = [dir[0] * 5, dir[1] * 5], side = [-dir[1] * 5, dir[0] * 5];
  for (const s of [-1, 1]){
    const ex = cx + fwd[0] + side[0] * s, ey = cy + fwd[1] + side[1] * s;
    ctx.fillStyle = '#F5FAFF';
    ctx.beginPath(); ctx.arc(ex, ey, 4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#12161C';
    ctx.beginPath(); ctx.arc(ex + dir[0] * 2, ey + dir[1] * 2, 2, 0, Math.PI * 2); ctx.fill();
  }

  ctx.textAlign = 'center';
  if (state === 'ready')
    overlay('贪 吃 蛇', '点按屏幕或按方向键开始', '方向键 / WASD 移动 · 空格暂停', false);
  else if (state === 'paused')
    overlay('已 暂 停', '点按屏幕或按空格继续', '', false);
  else if (state === 'over')
    overlay('游戏结束', '最终得分 ' + score + '     最高分 ' + loadBest(),
            '点按屏幕 / 按 R 重新开始', true);
}

function overlay(title, sub, hint, big){
  ctx.fillStyle = 'rgba(8,10,14,.87)'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = big ? C.food : C.text;
  ctx.font = '700 ' + (big ? 52 : 44) + 'px ' + FONT;
  ctx.fillText(title, W / 2, H / 2 - 50);
  ctx.fillStyle = C.dim;
  ctx.font = '500 19px ' + FONT;
  ctx.fillText(sub, W / 2, H / 2 + 12);
  if (hint){ ctx.font = '400 15px ' + FONT; ctx.fillText(hint, W / 2, H / 2 + 52); }
}

/* ============ 主循环 ============ */
function showError(e){
  const box = document.getElementById('err');
  box.style.display = 'block';
  box.textContent = '运行出错：' + (e && e.message ? e.message : e) +
    ' —— 请换 Edge / Chrome 浏览器打开本文件';
}
function frame(t){
  try{
    const dt = Math.min(t - (lastTime || t), 100);
    lastTime = t;
    update(dt);
    draw(t);
    requestAnimationFrame(frame);
  }catch(e){ showError(e); }
}

try{
  reset();
  requestAnimationFrame(frame);
}catch(e){ showError(e); }
</script>
</body>
</html>
